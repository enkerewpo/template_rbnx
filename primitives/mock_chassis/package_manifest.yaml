manifestVersion: 1

package:
  name: com.example.template.mock_chassis
  version: 0.1.0
  vendor: example
  description: Mock chassis primitive — fake odometry + /cmd_vel echo, runs in a ROS 2 docker container.
  license: MIT

# cap_id is what shows up in `rbnx caps`. Convention: short name, same
# across the three places it appears (atlas, package, manifest).
capability_id: mock_chassis

build: bash scripts/build.sh
start: bash scripts/start.sh

# Built-in chassis contracts (live under <robonix>/capabilities/primitive/chassis/).
# We don't redeclare them locally — primitives reuse the canonical
# contract surface. Only skills need package-local capabilities/.
capabilities:
  - name: robonix/primitive/chassis/driver
  - name: robonix/primitive/chassis/move
  - name: robonix/primitive/chassis/twist_in
  - name: robonix/primitive/chassis/odom
